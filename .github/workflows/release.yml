name: Release


on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      sha: ${{ steps.read.outputs.sha }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: read
        name: Read the version and prove the tag agrees with it
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_run" ] &&
             git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already released; bump src-tauri/tauri.conf.json to publish this commit"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag_name="$GITHUB_REF_NAME"
            if [ "${tag_name#v}" != "$version" ]; then
              echo "::error::tag $tag_name does not match src-tauri/tauri.conf.json version $version"
              echo "The release name would lie about its contents: latest.json and"
              echo "every artifact signature carry the config version, and"
              echo "requireSignedVersion compares the signed version against the announced one."
              exit 1
            fi
            echo "tag=$tag_name" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi
      - name: Open a draft release that devices cannot see yet
        if: steps.read.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.read.outputs.tag }}
          VERSION: ${{ steps.read.outputs.version }}
          SHA: ${{ steps.read.outputs.sha }}
        run: |
          set -eu
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG already exists; the bundle jobs upload to it"
            exit 0
          fi
          sed "s/__VERSION__/$VERSION/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --draft --target "$SHA" \
            --title "Chayote $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  desktop:
    name: Bundle (${{ matrix.os }})
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-latest
            bundles: deb,appimage
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseCommitish: ${{ needs.version.outputs.sha }}
          releaseName: Chayote ${{ needs.version.outputs.version }}
          releaseDraft: true
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }}
      - name: Portable executable (Windows)
        if: matrix.os == 'windows-latest'
        run: npx tauri build --no-bundle
      - uses: actions/upload-artifact@v5
        if: matrix.os == 'windows-latest'
        with:
          name: chayote-portable-${{ matrix.os }}
          path: src-tauri/target/release/chayote.exe
          retention-days: 30
          if-no-files-found: error

  android:
    name: APK (Android)
    needs: [version, desktop]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up the Android SDK
        run: |
          set -eu
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export PATH="$sdk_root/cmdline-tools/latest/bin:$PATH"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-37.0" "build-tools;36.1.0"
          sdkmanager --list_installed | grep -E "platforms;android-37|build-tools"
      - run: npm ci

      - name: Set up the release signing key
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          cd src-tauri/gen/android
          printf '%s' "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/chayote-release.jks"
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/chayote-release.jks"
          } > keystore.properties
          keytool -list -keystore "$RUNNER_TEMP/chayote-release.jks" \
            -storepass "$ANDROID_KEY_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build the release APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          TAURI_ANDROID_PROJECT_PATH: ${{ github.workspace }}/src-tauri/gen/android
        run: npx tauri android build --apk --ci --target aarch64 --target armv7

      - name: Sign the APK as an updater artifact
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release.apk' | head -1)
          test -n "$apk"
          npx tauri signer sign "$apk" --app-version "$VERSION"
          mkdir -p dist-android
          cp "$apk" "dist-android/app-universal-release.apk"
          cp "$apk.sig" "dist-android/app-universal-release.apk.sig"
          ls -l dist-android

      - name: Merge the Android keys into latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          gh release download "$TAG" --pattern latest.json --dir manifest --clobber
          node scripts/android-updater-manifest.mjs \
            manifest/latest.json \
            dist-android/app-universal-release.apk.sig \
            app-universal-release.apk \
            "$VERSION" "$TAG" > manifest/latest.json.new
          mv manifest/latest.json.new manifest/latest.json
          gh release upload "$TAG" \
            dist-android/app-universal-release.apk \
            dist-android/app-universal-release.apk.sig \
            manifest/latest.json \
            --clobber

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest

      - name: Prove the published release serves the Android update
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          # Read back rather than trusting the write: a manifest that names an
          # asset the release does not carry produces an updater that offers an
          # update and then fails to download it.
          curl -fsSL -o /dev/null \
            "https://github.com/vladimirbsuir/chayote/releases/download/$TAG/app-universal-release.apk"
          curl -fsSL "https://github.com/vladimirbsuir/chayote/releases/latest/download/latest.json" \
            | node -e "const m=JSON.parse(require('fs').readFileSync(0,'utf8'));if(!m.platforms['android-aarch64'])throw new Error('no android key');if(!m.platforms['android-armv7'])throw new Error('no armv7 key');console.log('published android keys:', Object.keys(m.platforms).length)"