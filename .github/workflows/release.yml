name: Release

# ADR-024. Every bundle in `06-platform.md` §3.7 is produced on a clean runner,
# one job per OS, and published as a GitHub Release rather than as an Actions
# artifact. That change is what makes the updater possible: `tauri-plugin-updater`
# reads a static `latest.json` over HTTPS, and an artifact bucket is not an
# endpoint. It also fixes the old workflow's deprecated `upload-artifact@v4` and
# gives bundles stable download URLs.
#
# Triggered by pushing a `v*` tag. A manual dispatch publishes the version
# currently in `src-tauri/tauri.conf.json`, which the `version` job below asserts
# is the same thing a tag would have had to be.
#
# The Android APK is intentionally not built here, for the reasons in the header
# of the M8 note below, and `06-platform.md` §4.6 records why the app cannot
# update itself on Android at all.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Creating and updating a Release needs a write token. `contents: write` and
# nothing else: no `actions: write`, no packages, no deployments.
permissions:
  contents: write

# Two tags pushed in quick succession must not race for `releases/latest`, which
# is the endpoint `plugins.updater.endpoints` reads. Serialising per branch means
# the second waits, and `latest` settles on the higher version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        name: Read the version and prove the tag agrees with it
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag_name="$GITHUB_REF_NAME"
            if [ "${tag_name#v}" != "$version" ]; then
              echo "::error::tag $tag_name does not match src-tauri/tauri.conf.json version $version"
              echo "The release name would lie about its contents: latest.json and"
              echo "every artifact signature carry the config version, and"
              echo "requireSignedVersion compares the signed version against the announced one."
              exit 1
            fi
            echo "tag=$tag_name" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi

  desktop:
    name: Bundle (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    # The signing key lives in the `release` environment, not at repository
    # level. A job only sees an environment's secrets when it names the
    # environment, and the failure without this is a build that stops at
    # "no private key" rather than anything obvious about permissions.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-latest
            bundles: deb,appimage
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci
      # `createUpdaterArtifacts` in tauri.conf.json makes the bundler sign every
      # artifact, and a bundle with no signature cannot be updated from. The key
      # is a repository secret and is never written to the runner's disk.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Chayote ${{ needs.version.outputs.version }}
          releaseBody: |
            Chayote ${{ needs.version.outputs.version }}.

            Windows and Linux builds update themselves from **Settings → Updates**.
            macOS and Android builds do not, for the reasons in
            [`docs/06-platform.md`](https://github.com/vladimirbsuir/chayote/blob/main/docs/06-platform.md).

            Download | Asset
            --- | ---
            Windows | `Chayote_${{ needs.version.outputs.version }}_x64-setup.exe`
            macOS | `.app.tar.gz` or `.dmg`
            Linux | `.AppImage` or `.deb`
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }}
      # Only the portable executable is uploaded as a workflow artifact. The
      # bundles reach users through the Release above, which has stable URLs and
      # is what the updater resolves; keeping a second copy in the artifact store
      # would be a second place to look for a build that could drift.
      - name: Portable executable (Windows)
        if: matrix.os == 'windows-latest'
        run: npx tauri build --no-bundle
      - uses: actions/upload-artifact@v5
        if: matrix.os == 'windows-latest'
        with:
          name: chayote-portable-${{ matrix.os }}
          path: src-tauri/target/release/chayote.exe
          retention-days: 30
          if-no-files-found: error

  # ADR-025. Runs after the desktop matrix, and the ordering is not incidental:
  # `tauri android build` packages through Gradle, so it produces no updater
  # artifact and `tauri-action` has nothing to merge. This job signs the APK
  # itself and merges one manifest key into the document the matrix already
  # published — which only exists once that matrix has finished.
  android:
    name: APK (Android)
    needs: [version, desktop]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - uses: android-actions/setup-android@v3
      - run: npm ci

      # Android refuses an update whose signing certificate differs from the
      # installed one, so a debug-signed APK could never update in place. The
      # default debug keystore is public knowledge, which would make any APK
      # claiming to be this app installable, so the release key is ours and is
      # a secret. Losing it costs every installed user their notes: Android
      # gives no way to update, only to uninstall, and uninstalling deletes
      # chayote.db. `06-platform.md` §4.6 records it.
      - name: Set up the release signing key
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          cd src-tauri/gen/android
          printf '%s' "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/chayote-release.jks"
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/chayote-release.jks"
          } > keystore.properties
          keytool -list -keystore "$RUNNER_TEMP/chayote-release.jks" \
            -storepass "$ANDROID_KEY_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      # Both ARM ABIs in one APK, which is what makes a single signature serve the
      # two manifest keys. `x86_64` is not shipped (`06-platform.md` §4.1), so an
      # emulator's check finds no key and says so rather than offering nothing.
      - name: Build the release APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          TAURI_ANDROID_PROJECT_PATH: ${{ github.workspace }}/src-tauri/gen/android
        run: npx tauri android build --apk --target aarch64 --target armv7

      - name: Sign the APK as an updater artifact
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release.apk' | head -1)
          test -n "$apk"
          npx tauri signer sign "$apk" --app-version "$VERSION"
          mkdir -p dist-android
          cp "$apk" "dist-android/app-universal-release.apk"
          cp "$apk.sig" "dist-android/app-universal-release.apk.sig"
          ls -l dist-android

      - name: Merge the Android keys into latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          gh release download "$TAG" --pattern latest.json --dir manifest --clobber
          node scripts/android-updater-manifest.mjs \
            manifest/latest.json \
            dist-android/app-universal-release.apk.sig \
            app-universal-release.apk \
            "$VERSION" "$TAG" > manifest/latest.json.new
          mv manifest/latest.json.new manifest/latest.json
          # Read back rather than trusting the write: a manifest that names an
          # asset the release does not carry produces an updater that offers an
          # update and then fails to download it.
          gh release upload "$TAG" \
            dist-android/app-universal-release.apk \
            dist-android/app-universal-release.apk.sig \
            manifest/latest.json \
            --clobber
          curl -fsSL -o /dev/null \
            "https://github.com/vladimirbsuir/chayote/releases/download/$TAG/app-universal-release.apk"
          curl -fsSL "https://github.com/vladimirbsuir/chayote/releases/latest/download/latest.json" \
            | node -e "const m=JSON.parse(require('fs').readFileSync(0,'utf8'));if(!m.platforms['android-aarch64'])throw new Error('no android key');if(!m.platforms['android-armv7'])throw new Error('no armv7 key');console.log('published android keys:', Object.keys(m.platforms).length)"