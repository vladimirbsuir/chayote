name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  e2e:
    # Sharded across machines, not workers: one runner's CPUs are already
    # saturated at two workers, so more workers on the same box only add
    # contention. Each shard gets its own runner and half the suite.
    # Touch-emulation tests are excluded here (tagged `@touch`): their
    # real-timer holds break under a shared runner, so they run alone in
    # `e2e-touch` below instead.
    name: End-to-end (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/2 --grep-invert @touch
      # Traces (and the screenshots inside them) are the only way to see a
      # headless failure after the runner is gone. Kept on failure only.
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-trace-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  e2e-touch:
    # The `@touch` block alone on one worker: emulated-touch timing needs an
    # unloaded browser, which the sharded gate cannot promise.
    name: End-to-end (touch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep @touch --workers=1
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-trace-touch
          path: test-results/
          retention-days: 7
