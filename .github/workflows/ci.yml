name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  e2e:
    # Sharded across machines, not workers: one runner's CPUs are already
    # saturated at two workers, so more workers on the same box only add
    # contention. Each shard gets its own runner and part of the suite.
    # Touch-emulation tests (tagged `@touch`) ride in the same matrix as
    # their own entry: their real-timer holds need an unloaded browser, so
    # they run alone on one worker rather than in a shard.
    name: End-to-end (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shard 1
            slug: shard-1
            args: --shard=1/2 --grep-invert @touch
          - name: shard 2
            slug: shard-2
            args: --shard=2/2 --grep-invert @touch
          - name: touch
            slug: touch
            args: --grep @touch --workers=1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test ${{ matrix.args }}
      # Traces (and the screenshots inside them) are the only way to see a
      # headless failure after the runner is gone. `always()` rather than
      # `failure()`: with `retries: 2` a shard that flakes and then passes exits
      # 0, so `failure()` is false and the run looks green while its `##[error]`
      # lines stay in the log with no trace attached. Uploading always keeps the
      # first-retry trace for exactly those flakes; fully green runs upload
      # nothing (`if-no-files-found: ignore`).
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-trace-${{ matrix.slug }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
