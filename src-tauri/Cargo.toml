[package]
name = "chayote"
version = "0.3.0"
description = "Chayote — a fast, quiet place to write"
authors = ["Chayote contributors"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "chayote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
tokio = { version = "1.53.2", features = ["rt", "time", "macros", "net", "sync"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1", "with-uuid-1"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0.9"
tokio-postgres-rustls = "0.14.0"

tauri-plugin-updater = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
rustls-platform-verifier = "0.7"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
