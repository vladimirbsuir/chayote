[package]
name = "chayote"
version = "0.1.0"
description = "Chayote — a fast, quiet place to write"
authors = ["Chayote contributors"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "chayote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
tokio = { version = "1.53.2", features = ["rt", "time", "macros", "net", "sync"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1", "with-uuid-1"] }
rustls = "0.23.45"
webpki-roots = "1.0.9"
tokio-postgres-rustls = "0.14.0"

# Windows only: reaching WebView2's settings to hand browser accelerators
# (Ctrl+F find, …) to the page (`06-platform.md` §1, shortcuts).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

# The updater is a desktop-only dependency (ADR-024). Its own manifest declares
# `android = { level = "none" }` and `install_inner` returns `Error::UnsupportedOs`
# under `cfg(mobile)`, so compiling it on Android would buy an APK download with
# no way to install it — and would put a plugin in the app that can only fail.
# Excluding the target also keeps `REQUEST_INSTALL_PACKAGES` off the manifest.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
